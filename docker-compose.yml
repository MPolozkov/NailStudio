version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: nailstudio_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${USER}
      POSTGRES_PASSWORD: ${PASSWORD}
      POSTGRES_DB: ${DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USER} -d ${DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - nailstudio

  backend:
    build: ./backend
    container_name: nailstudio_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${USER}:${PASSWORD}@db:5432/${DB}
      SECRET_KEY: ${KEY_BACKEND}
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      CORS_ORIGINS: ${CORS_ORIGINS}
      # --- Уведомления: SMTP (email) ---
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_USE_TLS: "true"
      # --- Уведомления: Telegram-бот ---
      TELEGRAM_BOT_TOKEN: ""
    depends_on:
      db:
        condition: service_healthy
    #ports:
      #- "8000:8000"
    networks:
      - nailstudio

  frontend:
    build: ./frontend
    container_name: nailstudio_frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://backend:8000
    depends_on:
      - backend
    # ports:
      # - "3000:80"
    networks:
      - nailstudio

volumes:
  db_data:

networks:
  nailstudio: